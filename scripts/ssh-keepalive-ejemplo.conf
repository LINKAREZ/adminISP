# Añadir a ~/.ssh/config en tu máquina LOCAL para evitar desconexiones por timeout.
# Copia este bloque y sustituye Host/User si usas otros valores.
#
# Host panel.wan.pe
#     User root
#     HostName panel.wan.pe
#     IdentityFile ~/.ssh/id_ed25519_vps
#     ServerAliveInterval 60
#     ServerAliveCountMax 3
#
# ServerAliveInterval 60 = enviar keepalive cada 60 segundos
# ServerAliveCountMax 3  = hasta 3 intentos antes de cerrar (≈ 3 min sin respuesta)
