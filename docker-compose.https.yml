# Override para usar HTTPS. Uso:
# 1) Generar certificados: ./scripts/ssl-selfsigned.sh
# 2) Levantar con: docker compose -f docker-compose.yml -f docker-compose.https.yml up -d

services:
  nginx:
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certs:/etc/nginx/ssl:ro
